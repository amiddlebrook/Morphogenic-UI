<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Morphogenetic OS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap"
    rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Space Grotesk', 'sans-serif'],
          },
          colors: {
            bio: {
              bg: '#0F1110',
              surface: '#1A1D1C',
              text: '#E0E8E3',
              primary: '#9EFFC5', // Bioluminescent Green
              secondary: '#FF9EAE', // Flesh tone accent
              glass: 'rgba(255, 255, 255, 0.05)',
              border: 'rgba(158, 255, 197, 0.2)',
            }
          },
          animation: {
            'breathe': 'breathe 8s ease-in-out infinite',
            'drift': 'drift 20s linear infinite',
            'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
            'mitosis': 'mitosis 0.5s ease-out forwards',
          },
          keyframes: {
            breathe: {
              '0%, 100%': { transform: 'scale(1)' },
              '50%': { transform: 'scale(1.02)' },
            },
            drift: {
              '0%': { backgroundPosition: '0% 0%' },
              '100%': { backgroundPosition: '100% 100%' },
            },
            mitosis: {
              '0%': { transform: 'scale(0.8)', opacity: '0' },
              '100%': { transform: 'scale(1)', opacity: '1' },
            }
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #0F1110;
      color: #E0E8E3;
      font-family: 'Space Grotesk', sans-serif;
      overflow: hidden;
    }

    /* Turing Pattern / Reaction Diffusion Background */
    .turing-pattern {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 0;
      opacity: 0.15;
      background-image:
        radial-gradient(circle at 100% 50%, transparent 20%, #1A1D1C 21%, #1A1D1C 34%, transparent 35%, transparent),
        radial-gradient(circle at 0% 50%, transparent 20%, #1A1D1C 21%, #1A1D1C 34%, transparent 35%, transparent);
      background-size: 100px 100px;
      filter: blur(2px) contrast(1.2);
      animation: drift 60s linear infinite;
      pointer-events: none;
    }

    .noise-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 9999;
      opacity: 0.05;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
    }

    /* Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: rgba(158, 255, 197, 0.2);
      border-radius: 99px;
    }
  </style>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="./index.tsx"></script>
</body>

</html>
